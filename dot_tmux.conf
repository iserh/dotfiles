# enable mouse scrolling & vim scrolling
setw -g mouse on
setw -g mode-keys vi

# Name windows after the working directory, not the running command. tmux
# re-evaluates this against the active pane, so the name follows every `cd`.
# `allow-rename off` (the default) is what keeps a shell's title escape
# sequence from overriding it; nvim and ssh both emit one.
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'

set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Set new panes to open in current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

